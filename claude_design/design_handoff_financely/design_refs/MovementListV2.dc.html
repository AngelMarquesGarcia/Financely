<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>.fc-mv2-row{transition:background .12s ease;cursor:pointer}.fc-mv2-row:hover{background:#f7f9fc}</style>
</helmet>
<div style="font-family:Nunito,sans-serif;padding:16px;">
  <div style="width:400px;max-width:100%;background:#fff;border:1px solid #eceef2;border-radius:16px;box-shadow:0 1px 3px rgba(20,30,50,.06);overflow:hidden;">
    <sc-for list="{{ groups }}" as="grp" hint-placeholder-count="2">
      <div style="padding:11px 18px 6px;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#b0b7c2;background:#fbfcfe;border-top:1px solid #f2f4f7;">{{ grp.label }}</div>
      <sc-for list="{{ grp.rows }}" as="row" hint-placeholder-count="3">
        <div class="fc-mv2-row" onClick="{{ row.onClick }}" style="display:flex;align-items:center;gap:12px;padding:11px 18px;border-top:1px solid #e3e7ee;">
          <span style="width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;background:{{ row.iconBg }};">{{ row.emoji }}</span>
          <div style="min-width:0;flex:1;">
            <div style="display:flex;align-items:center;gap:7px;">
              <span style="font-size:14px;font-weight:700;color:#1b2430;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ row.name }}</span>
              <span style="display:{{ row.anomDisplay }};font-size:10px;font-weight:800;color:#a9761f;background:#fbf4e7;border-radius:5px;padding:1px 5px;flex:none;">ANOMALOUS</span>
            </div>
            <div style="display:flex;align-items:center;gap:6px;margin-top:2px;">
              <span style="font-size:12px;font-weight:600;color:{{ row.catColor }};">{{ row.category }}</span>
              <span style="color:#c9cfd8;font-size:11px;">·</span>
              <span style="font-size:12px;font-weight:600;color:#98a1b0;">{{ row.date }}</span>
              <span style="display:{{ row.tagDisplay }};font-size:11px;font-weight:700;color:{{ row.tagColor }};background:{{ row.tagBg }};border-radius:999px;padding:1px 8px;">{{ row.tag }}</span>
            </div>
          </div>
          <span style="font-size:15px;font-weight:800;color:{{ row.color }};flex:none;">{{ row.amount }}</span>
        </div>
      </sc-for>
    </sc-for>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:460}}">
class Component extends DCLogic {
  async componentDidMount(){ this.lib = await import('./finance-lib.js'); this.forceUpdate(); }
  hexRgb(h){ const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h||'#2f6bf6'); return m?[parseInt(m[1],16),parseInt(m[2],16),parseInt(m[3],16)]:[47,107,246]; }
  tint(h,a){ const [r,g,b]=this.hexRgb(h); return `rgba(${r},${g},${b},${a})`; }
  renderVals(){
    const L = this.lib; if(!L) return { groups:[] };
    // window.movements.getAll() + window.tags.getForMovements(ids)
    const mk = (m)=>{
      const signed = m.isPositive ? m.quantityCents : -m.quantityCents;
      const cat = L.catOf(m.categoryId);
      const tag = m.tagIds.length ? L.tagOf(m.tagIds[0]) : null;
      return {
        name:m.name, emoji:cat.emoji, iconBg:this.tint(cat.color,.12),
        category:cat.name, catColor:this.tint(cat.color,1),
        date:L.fmtRelDate(m.date),
        tag: tag?tag.name:'', tagDisplay: tag?'inline':'none',
        tagColor: tag?this.tint(tag.color,.75):'#000', tagBg: tag?this.tint(tag.color,.12):'#000',
        anomDisplay: m.isAnomalous?'inline':'none',
        amount:L.fmtMoney(signed,{sign:true}), color: signed>0?'#1c8a4d':'#d23b2b', onClick:()=>{},
      };
    };
    const all = L.MOVEMENTS.filter(m=>!m.isTentative && !m.parentId);
    const todays = all.filter(m=>L.fmtRelDate(m.date)==='Today').map(mk);
    const earlier = all.filter(m=>L.fmtRelDate(m.date)!=='Today').map(mk);
    return { groups:[ {label:'Today', rows:todays}, {label:'Earlier', rows:earlier} ] };
  }
}
</script>
</body>
</html>
