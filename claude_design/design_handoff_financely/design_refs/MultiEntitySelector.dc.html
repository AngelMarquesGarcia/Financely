<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  .fc-opt{cursor:pointer;transition:background .1s}.fc-opt:hover{background:#f3f6fb}
  .fc-selchip{cursor:pointer;transition:filter .12s}.fc-selchip:hover{filter:brightness(.97)}
  .fc-selchip .fc-rmx{opacity:.45;transition:opacity .12s}.fc-selchip:hover .fc-rmx{opacity:1}
</style>
</helmet>
<div style="font-family:Nunito,sans-serif;padding:16px;">
  <div style="width:360px;max-width:100%;">
    <label style="display:{{ labelDisplay }};font-size:12px;font-weight:700;color:#5b6472;margin-bottom:6px;">{{ entityLabel }}</label>
    <!-- dropdown -->
    <div style="position:relative;">
      <div class="fc-opt" onClick="{{ onToggle }}" style="display:flex;align-items:center;justify-content:space-between;border:1px solid {{ boxBorder }};border-radius:11px;padding:10px 12px;background:#fff;cursor:pointer;box-shadow:{{ boxShadow }};">
        <span style="font-size:13.5px;font-weight:600;color:#98a1b0;">{{ placeholder }}</span>
        <span style="color:#b6bdc9;transform:{{ caretRot }};transition:transform .16s;">⌄</span>
      </div>
      <div style="display:{{ menuDisplay }};position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:20;background:#fff;border:1px solid #e6e8ee;border-radius:12px;box-shadow:0 12px 34px rgba(20,30,50,.16);overflow:hidden;max-height:230px;overflow-y:auto;">
        <sc-for list="{{ options }}" as="opt" hint-placeholder-count="5">
          <div class="fc-opt" onClick="{{ opt.onPick }}" style="display:flex;align-items:center;gap:9px;padding:9px 12px;border-top:{{ opt.border }};">
            <span style="width:9px;height:9px;border-radius:50%;flex:none;background:{{ opt.dot }};box-shadow:{{ opt.halo }};"></span>
            <span style="font-size:13.5px;font-weight:{{ opt.weight }};color:{{ opt.fg }};">{{ opt.name }}</span>
          </div>
        </sc-for>
        <div style="display:{{ emptyOptDisplay }};padding:12px;text-align:center;font-size:12.5px;font-weight:600;color:#b0b7c2;">All options selected</div>
      </div>
    </div>
    <!-- selected list (Tag card instances) -->
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:11px;min-height:20px;">
      <sc-for list="{{ selected }}" as="sel" hint-placeholder-count="2">
        <span class="fc-selchip" onClick="{{ sel.onRemove }}" title="Remove" style="display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;font-weight:600;font-size:13px;line-height:1;background:{{ sel.bg }};border:1px solid {{ sel.border }};color:{{ sel.fg }};">
          <span style="width:8px;height:8px;border-radius:50%;background:{{ sel.dot }};"></span>{{ sel.name }}<span class="fc-rmx" style="font-weight:800;">×</span>
        </span>
      </sc-for>
      <span style="display:{{ noneDisplay }};font-size:12.5px;font-weight:600;color:#b0b7c2;">{{ noneText }}</span>
    </div>
    <div style="display:{{ noteDisplay }};margin-top:12px;font-size:11px;font-weight:600;color:#c3cad4;">Returns <span style="color:#98a1b0;font-weight:700;">{{ noteText }}</span> to parent.</div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:220},&quot;entity&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;envelope&quot;,&quot;category&quot;,&quot;tag&quot;],&quot;default&quot;:&quot;envelope&quot;,&quot;tsType&quot;:&quot;'envelope'|'category'|'tag'&quot;},&quot;allowAll&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;hideLabel&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;hideNote&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open:false, selectedIds:[], all:false };
  async componentDidMount(){ this.lib = await import('./finance-lib.js'); this.forceUpdate(); }
  hexRgb(h){ const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h||'#2f6bf6'); return m?[parseInt(m[1],16),parseInt(m[2],16),parseInt(m[3],16)]:[47,107,246]; }
  tint(h,a){ const [r,g,b]=this.hexRgb(h); return `rgba(${r},${g},${b},${a})`; }
  dark(h){ const [r,g,b]=this.hexRgb(h); return `rgb(${Math.round(r*.55)},${Math.round(g*.55)},${Math.round(b*.55)})`; }
  source(){
    const L=this.lib; const kind=this.props.entity||'envelope';
    if(kind==='category') return L.CATEGORIES.map(c=>({id:c.id,name:c.name,color:c.color}));
    if(kind==='tag') return L.TAGS.map(t=>({id:t.id,name:t.name,color:t.color}));
    return L.ENVELOPES.map(e=>({id:e.id,name:e.name,color:e.color}));
  }
  renderVals(){
    const L=this.lib; if(!L) return { options:[], selected:[] };
    // Parent supplies name + options; component returns EntryList[] | true (see page-4 note)
    const kind=this.props.entity||'envelope';
    const label={envelope:'Envelopes',category:'Categories',tag:'Tags'}[kind];
    const all=this.state.all;
    const items=this.source();
    const chosen = all ? [] : items.filter(i=>this.state.selectedIds.includes(i.id));
    // options = "All" + not-yet-selected entries
    const avail = all ? [] : items.filter(i=>!this.state.selectedIds.includes(i.id));
    const allowAll = this.props.allowAll !== false;
    const options = [];
    if(!all && allowAll) options.push({ id:'__all', name:'All', dot:'#98a1b0', halo:'none', weight:'800', fg:'#1b2430', border:'0',
      onPick:()=>this.setState({all:true,selectedIds:[],open:false}) });
    avail.forEach((it,i)=>options.push({ id:it.id, name:it.name, dot:it.color, halo:'0 0 0 2px '+this.tint(it.color,.18),
      weight:'600', fg:'#1b2430', border:'1px solid #f2f4f7',
      onPick:()=>this.setState({selectedIds:[...this.state.selectedIds,it.id],open:false}) }));
    // selected chips ("All" collapses to one)
    let selected;
    if(all){ selected=[{ key:'all', name:'All', bg:'#eef0f4', border:'#d7dbe2', fg:'#5b6472', dot:'#98a1b0',
      onRemove:()=>this.setState({all:false}) }]; }
    else selected=chosen.map(it=>({ key:it.id, name:it.name, bg:this.tint(it.color,.10), border:this.tint(it.color,.30),
      fg:this.dark(it.color), dot:it.color, onRemove:()=>this.setState({selectedIds:this.state.selectedIds.filter(x=>x!==it.id)}) }));
    return {
      entityLabel: this.props.label || label,
      labelDisplay: this.props.hideLabel ? 'none' : 'block',
      placeholder:'Add '+kind+'…',
      onToggle:()=>this.setState({open:!this.state.open}),
      menuDisplay:this.state.open?'block':'none', caretRot:this.state.open?'rotate(180deg)':'none',
      boxBorder:this.state.open?'#2f6bf6':'#e3e6ec', boxShadow:this.state.open?'0 0 0 3px rgba(47,107,246,.14)':'none',
      options, emptyOptDisplay:options.length?'none':'block',
      selected, noneDisplay:selected.length?'none':'inline',
      noneText: allowAll ? 'Nothing selected — showing all.' : 'None yet — pick from the list.',
      noteDisplay: this.props.hideNote ? 'none' : 'block',
      noteText: allowAll ? 'true' : 'EntryList[]',
    };
  }
}
</script>
</body>
</html>
