<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>body{margin:0;background:#eef0f3;}.fc-btn{cursor:pointer;transition:filter .12s}.fc-btn:hover{filter:brightness(.97)}</style>
</helmet>
<div style="font-family:Nunito,sans-serif;background:#eef0f3;min-height:100vh;box-sizing:border-box;padding:24px 28px 40px;min-width:1200px;">
  <div style="max-width:1440px;margin:0 auto;">
    <!-- page header -->
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:6px;">
      <div>
        <div style="font-size:23px;font-weight:900;color:#1b2430;letter-spacing:-.2px;">Dashboard</div>
        <div style="font-size:13px;font-weight:600;color:#7c8494;margin-top:2px;">{{ subtitle }}</div>
      </div>
      <div style="display:flex;align-items:center;gap:9px;">
        <div style="display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border:1px solid #e3e6ec;border-radius:10px;background:#fff;"><span style="font-size:11px;font-weight:700;color:#b0b7c2;">Account</span><span style="font-size:13px;font-weight:700;color:#1b2430;">Main</span></div>
        <div style="display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border:1px solid #eef0f4;border-radius:10px;background:#f6f7f9;opacity:.6;"><span style="font-size:11px;font-weight:700;color:#b0b7c2;">Filters</span><span style="font-size:12px;font-weight:700;color:#98a1b0;">Disabled</span></div>
      </div>
    </div>

    <!-- ── stat card row (account level, clickable → per-envelope modal) ── -->
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:16px 0 20px;">
      <dc-import name="StatCard" type="calculated" title="Balance" modal-title="{{ st.balance.modalTitle }}" accent="{{ st.balance.accent }}" value-cents="{{ st.balance.total }}" rows="{{ st.balance.rows }}" footnote="{{ st.balance.footnote }}" hint-size="100%,96px"></dc-import>
      <dc-import name="StatCard" type="calculated" title="Budget" sublabel="{{ st.budget.sublabel }}" modal-title="{{ st.budget.modalTitle }}" accent="{{ st.budget.accent }}" value-cents="{{ st.budget.total }}" signed="{{ no }}" neutral-value="{{ yes }}" rows="{{ st.budget.rows }}" footnote="{{ st.budget.footnote }}" hint-size="100%,96px"></dc-import>
      <dc-import name="StatCard" type="calculated" title="Cash Flow" modal-title="{{ st.cashflow.modalTitle }}" accent="{{ st.cashflow.accent }}" value-cents="{{ st.cashflow.total }}" rows="{{ st.cashflow.rows }}" footnote="{{ st.cashflow.footnote }}" hint-size="100%,96px"></dc-import>
      <dc-import name="StatCard" type="calculated" title="Income" modal-title="{{ st.income.modalTitle }}" accent="{{ st.income.accent }}" value-cents="{{ st.income.total }}" rows="{{ st.income.rows }}" footnote="{{ st.income.footnote }}" hint-size="100%,96px"></dc-import>
      <dc-import name="StatCard" type="calculated" title="Expenses" modal-title="{{ st.expenses.modalTitle }}" accent="{{ st.expenses.accent }}" value-cents="{{ st.expenses.total }}" rows="{{ st.expenses.rows }}" footnote="{{ st.expenses.footnote }}" hint-size="100%,96px"></dc-import>
    </div>

    <!-- ── middle row: period summary · pie · periodic list ── -->
    <div style="display:grid;grid-template-columns:minmax(360px,1fr) minmax(340px,1fr) minmax(340px,1fr);gap:20px;margin-bottom:20px;align-items:stretch;">
      <div style="display:flex;"><dc-import name="PeriodSummaryCard" view="single" style="width:100%;" hint-size="100%,100%"></dc-import></div>
      <div style="display:flex;"><dc-import name="PieChart" use-filters="{{ yes }}" style="width:100%;height:100%;" hint-size="100%,100%"></dc-import></div>
      <div style="display:flex;flex-direction:column;background:#fff;border:1px solid #e3e6ec;border-radius:16px;box-shadow:0 1px 3px rgba(20,30,50,.05);overflow:hidden;">
        <div style="padding:14px 16px 4px;font-size:15px;font-weight:800;color:#1b2430;">Tentative &amp; upcoming</div>
        <div style="flex:1;"><dc-import name="PeriodicList" periodic-id="9" style="width:100%;" hint-size="100%,100%"></dc-import></div>
      </div>
    </div>

    <!-- ── bottom row: latest movements · bar/line chart ── -->
    <div style="display:grid;grid-template-columns:minmax(340px,1fr) minmax(640px,2.1fr);gap:20px;align-items:start;">
      <div style="display:flex;"><dc-import name="MovementListV1" style="width:100%;" hint-size="100%,100%"></dc-import></div>
      <div style="display:flex;"><dc-import name="BarChart" use-filters="{{ yes }}" style="width:100%;" hint-size="100%,420px"></dc-import></div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  async componentDidMount(){ this.lib = await import('./finance-lib.js'); this.forceUpdate(); }
  renderVals(){
    const L=this.lib;
    // window.periodSummaries.getAll(accountId, year, month) feeds the stat cards.
    const st = L ? L.dashboardStats() : { balance:{}, budget:{}, cashflow:{}, income:{}, expenses:{} };
    return {
      subtitle: "Main · January '26 · current month",
      st, yes:true, no:false,
    };
  }
}
</script>
</body>
</html>
