<ng-content select="[popoverTrigger]" />
@if (open) {
  <button class="popover-backdrop" type="button" (click)="backdropClick.emit()" aria-label="Close"></button>
  <div
    class="popover-panel"
    [class.popover-panel--right]="align === 'right'"
    [class.popover-panel--no-arrow]="!showArrow"
    [style.width.px]="width"
  >
    <ng-content />
  </div>
}
