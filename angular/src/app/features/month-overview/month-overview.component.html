<div class="month-overview">
  <header class="month-overview__header">
    <div class="month-overview__nav">
      <button class="btn btn--ghost" type="button" (click)="prevMonth()" [disabled]="!hasPrev" aria-label="Previous month">‹</button>
      <h1 class="month-overview__title">{{ monthLabel }}</h1>
      <button class="btn btn--ghost" type="button" (click)="nextMonth()" [disabled]="!hasNext" aria-label="Next month">›</button>
    </div>
    <label class="month-overview__toggle">
      <input type="checkbox" [(ngModel)]="showAnomalies" />
      Include anomalous movements
    </label>
  </header>

  <section class="month-overview__section">
    <h2 class="month-overview__section-title">Envelopes</h2>
    @if (envelopeSummaries.length === 0) {
      <p class="month-overview__empty">No period summaries yet.</p>
    } @else {
      @for (s of envelopeSummaries; track s.envelopeId) {
        <app-period-summary-card [summary]="s" [showAnomalies]="showAnomalies" />
      }
    }
  </section>
</div>
