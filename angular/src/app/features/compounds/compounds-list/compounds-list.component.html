@if (compounds.length === 0) {
  <app-empty-state icon="⛓" message="No compound movements yet." />
} @else {
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Type</th>
          <th>Owner month</th>
          <th>Movements</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (c of compounds; track c.id) {
          <tr>
            <td>
              {{ c.name }}
              @if (c.isAnomalous) {
                <span class="badge badge--anomalous" title="Anomalous — excluded from average/aggregate statistics">✷ anomalous</span>
              }
            </td>
            <td>
              @if (c.isCancelable) {
                <span class="badge badge--cancelable" title="Members cancel out; the net is the true movement">cancelable</span>
              } @else {
                <span class="badge badge--group" title="A grouping of movements viewed together">group</span>
              }
            </td>
            <td>{{ ownerLabel(c) }}</td>
            <td>{{ childCount(c) }}</td>
            <td>
              <div class="actions">
                <button class="btn btn--edit" type="button" (click)="editRequested.emit(c)">Edit</button>
                <button class="btn btn--delete" type="button" (click)="deleteRequested.emit(c)">Delete</button>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
