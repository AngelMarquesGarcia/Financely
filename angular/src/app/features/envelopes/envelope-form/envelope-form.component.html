<div class="card">
  <h2 class="card__title">
    {{ isEditing ? 'Edit Envelope #' + editingEnvelope!.id : 'New Envelope' }}
  </h2>

  <div class="form">
    <div class="form__group">
      <label class="form__label" for="name">Name</label>
      <input
        id="name"
        class="form__input"
        [class.form__input--error]="showErrors && !name.trim()"
        [(ngModel)]="name"
        placeholder="e.g. Groceries"
      />
      @if (showErrors && !name.trim()) {
        <span class="form__error">Name is required.</span>
      }
    </div>

    <div class="form__group">
      <label class="form__label" for="account">Account</label>
      <select
        id="account"
        class="form__input"
        [class.form__input--error]="showErrors && !accountId"
        [(ngModel)]="accountId"
      >
        <option [ngValue]="null" disabled>Select account…</option>
        @for (a of accounts; track a.id) {
          <option [ngValue]="a.id">{{ a.name }}</option>
        }
      </select>
      @if (showErrors && !accountId) {
        <span class="form__error">An account must be selected.</span>
      }
    </div>

    <div class="form__group">
      <span class="form__label">Categories</span>
      <app-entity-select
        [items]="categories"
        [selectedIds]="selectedCategoryIds"
        (selectedIdsChange)="selectedCategoryIds = $event"
        [labelFn]="categoryLabel"
        [colorFn]="categoryColor"
        [emojiFn]="categoryEmoji"
        [availableFilter]="categoryAvailable"
        addLabel="Add category"
        emptyMessage="All categories assigned"
      />
    </div>

    <div class="form__actions">
      <button class="btn btn--primary" (click)="save()">
        {{ isEditing ? 'Update' : 'Create' }}
      </button>
      @if (isEditing) {
        <button class="btn btn--ghost" (click)="cancel()">Cancel</button>
      }
    </div>
  </div>
</div>
